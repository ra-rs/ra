cpscu = []
crc = []
dac12 = []
dbg = []
dma = []
dmac0 = []
dmac1 = []
dmac2 = []
dmac3 = []
dmac4 = []
dmac5 = []
dmac6 = []
dmac7 = []
doc = []
dtc = []
eccmb = []
elc = []
faci = []
fcache = []
flad = []
gpt16e0 = []
gpt16e1 = []
gpt16e2 = []
gpt16e3 = []
gpt16e4 = []
gpt16e5 = []
gpt_ops = []
i3c = []
icu = []
iwdt = []
mstp = []
pfs = []
poeg = []
port0 = []
port1 = []
port2 = []
port3 = []
port4 = []
port5 = []
port8 = []
pscu = []
rmpu = []
rtc = []
sci0 = []
sci9 = []
